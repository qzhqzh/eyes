name: Apply open issue fixes

on:
  push:
    branches:
      - feat/asset-management

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/asset-management
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply fixes and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "app.py",
              '''_asset_mcp_request_times = {}
          _asset_mcp_rate_lock = threading.Lock()
          ''',
              '''ASSET_MCP_RATE_CLEANUP_INTERVAL_SECONDS = 60
          _asset_mcp_request_times = {}
          _asset_mcp_rate_lock = threading.Lock()
          _asset_mcp_last_cleanup = 0.0
          ''',
          )

          replace_once(
              "app.py",
              '''def _asset_mcp_rate_allowed(client_key):
              now = time.monotonic()
              with _asset_mcp_rate_lock:
                  recent = [
                      seen_at
                      for seen_at in _asset_mcp_request_times.get(client_key, [])
                      if now - seen_at < 60
                  ]
                  if len(recent) >= ASSET_MCP_RATE_LIMIT_PER_MINUTE:
                      _asset_mcp_request_times[client_key] = recent
                      return False
                  recent.append(now)
                  _asset_mcp_request_times[client_key] = recent
                  return True
          ''',
              '''def _asset_mcp_rate_allowed(client_key):
              global _asset_mcp_last_cleanup
              now = time.monotonic()
              with _asset_mcp_rate_lock:
                  if (
                      now - _asset_mcp_last_cleanup
                      >= ASSET_MCP_RATE_CLEANUP_INTERVAL_SECONDS
                  ):
                      for key, seen_times in list(_asset_mcp_request_times.items()):
                          active_times = [
                              seen_at for seen_at in seen_times if now - seen_at < 60
                          ]
                          if active_times:
                              _asset_mcp_request_times[key] = active_times
                          else:
                              _asset_mcp_request_times.pop(key, None)
                      _asset_mcp_last_cleanup = now

                  recent = [
                      seen_at
                      for seen_at in _asset_mcp_request_times.get(client_key, [])
                      if now - seen_at < 60
                  ]
                  if len(recent) >= ASSET_MCP_RATE_LIMIT_PER_MINUTE:
                      _asset_mcp_request_times[client_key] = recent
                      return False
                  recent.append(now)
                  _asset_mcp_request_times[client_key] = recent
                  return True
          ''',
          )

          replace_once(
              "asset_management.py",
              '''CONTEXT7_CACHE_SECONDS = 300
          CONTEXT7_QUERY_CACHE_SECONDS = 21600
          ''',
              '''CONTEXT7_CACHE_SECONDS = 300
          CONTEXT7_REFRESH_COOLDOWN_SECONDS = 30
          CONTEXT7_QUERY_CACHE_SECONDS = 21600
          ''',
          )

          replace_once(
              "asset_management.py",
              '''_context7_cursor = 0
          _cache_lock = threading.Lock()
          ''',
              '''_context7_cursor = 0
          _cache_lock = threading.Lock()
          _context7_refresh_lock = threading.Lock()
          ''',
          )

          replace_once(
              "asset_management.py",
              '''def get_context7_accounts(refresh=False):
              """Return quota evidence for configured accounts, never API keys."""
              accounts = load_context7_accounts()
              if not accounts:
                  return []
              with _cache_lock:
                  fresh = time.monotonic() - _context7_cache["at"] < CONTEXT7_CACHE_SECONDS
                  if _context7_cache["items"] and fresh and not refresh:
                      return _context7_cache["items"]

              def probe(account):
                  started = time.monotonic()
                  try:
                      status, _, headers, latency = _call_context7(
                          account["_api_key"],
                          "/api/v2/libs/search",
                          {"libraryName": "react", "query": "health check"},
                      )
                      return _context7_state(account["label"], status, headers, latency)
                  except (urllib.error.URLError, TimeoutError, OSError):
                      return {
                          "label": account["label"],
                          "state": "unreachable",
                          "status_code": None,
                          "limit": None,
                          "remaining": None,
                          "reset_at": None,
                          "retry_after_seconds": None,
                          "latency_ms": round((time.monotonic() - started) * 1000, 1),
                          "checked_at": _now_iso(),
                      }

              with ThreadPoolExecutor(max_workers=min(4, len(accounts))) as executor:
                  items = list(executor.map(probe, accounts))
              with _cache_lock:
                  _context7_runtime.update({item["label"]: item for item in items})
                  _context7_cache.update({"at": time.monotonic(), "items": items})
              return items
          ''',
              '''def get_context7_accounts(refresh=False):
              """Return quota evidence with cached, single-flight account probing."""
              accounts = load_context7_accounts()
              if not accounts:
                  return []

              def cached_items():
                  with _cache_lock:
                      items = _context7_cache["items"]
                      if not items:
                          return None
                      max_age = (
                          CONTEXT7_REFRESH_COOLDOWN_SECONDS
                          if refresh
                          else CONTEXT7_CACHE_SECONDS
                      )
                      if time.monotonic() - _context7_cache["at"] < max_age:
                          return items
                  return None

              cached = cached_items()
              if cached is not None:
                  return cached

              def probe(account):
                  started = time.monotonic()
                  try:
                      status, _, headers, latency = _call_context7(
                          account["_api_key"],
                          "/api/v2/libs/search",
                          {"libraryName": "react", "query": "health check"},
                      )
                      return _context7_state(account["label"], status, headers, latency)
                  except (urllib.error.URLError, TimeoutError, OSError):
                      return {
                          "label": account["label"],
                          "state": "unreachable",
                          "status_code": None,
                          "limit": None,
                          "remaining": None,
                          "reset_at": None,
                          "retry_after_seconds": None,
                          "latency_ms": round((time.monotonic() - started) * 1000, 1),
                          "checked_at": _now_iso(),
                      }

              with _context7_refresh_lock:
                  cached = cached_items()
                  if cached is not None:
                      return cached
                  with ThreadPoolExecutor(max_workers=min(4, len(accounts))) as executor:
                      items = list(executor.map(probe, accounts))
                  with _cache_lock:
                      _context7_runtime.update({item["label"]: item for item in items})
                      _context7_cache.update({"at": time.monotonic(), "items": items})
                  return items
          ''',
          )

          replace_once(
              "docker-compose.yml",
              '''    depends_on:
              eyes-asset-probe:
                condition: service_healthy
          ''',
              '''    depends_on:
              - eyes-asset-probe
          ''',
          )

          replace_once(
              "tests/test_asset_management.py",
              '''

          if __name__ == "__main__":
              unittest.main()
          ''',
              '''

              def test_context7_explicit_refresh_uses_server_side_cooldown(self):
                  accounts = [{"label": "primary", "_api_key": "ctx7sk-primary"}]
                  headers = Message()
                  headers["RateLimit-Limit"] = "100"
                  headers["RateLimit-Remaining"] = "99"
                  with mock.patch(
                      "asset_management.load_context7_accounts", return_value=accounts
                  ), mock.patch(
                      "asset_management._call_context7",
                      return_value=(200, b"{}", headers, 1.0),
                  ) as call:
                      first = asset_management.get_context7_accounts(refresh=True)
                      second = asset_management.get_context7_accounts(refresh=True)

                  self.assertEqual(call.call_count, 1)
                  self.assertIs(first, second)
                  self.assertEqual(first[0]["label"], "primary")


          if __name__ == "__main__":
              unittest.main()
          ''',
          )

          replace_once(
              "tests/test_web_app.py",
              '''from app import app, _secret_value
          client = app.test_client()
          ''',
              '''import app as app_module
          from app import app, _secret_value
          app_module._asset_mcp_request_times.clear()
          app_module._asset_mcp_request_times.update({
              "stale-client": [10.0],
              "active-client": [70.0],
          })
          app_module._asset_mcp_last_cleanup = 0.0
          with mock.patch("app.time.monotonic", return_value=100.0):
              assert app_module._asset_mcp_rate_allowed("new-client") is True
          assert "stale-client" not in app_module._asset_mcp_request_times
          assert app_module._asset_mcp_request_times["active-client"] == [70.0]
          assert app_module._asset_mcp_request_times["new-client"] == [100.0]
          client = app.test_client()
          ''',
          )
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run regression suite
        run: pytest -q

      - name: Compile Python modules
        run: python -m py_compile app.py asset_client.py asset_management.py asset_probe.py

      - name: Validate Compose configuration
        env:
          EYES_SECRET_KEY: ci-secret-key-with-more-than-32-characters
          EYES_WEB_PASSWORD: ci-web-password
        run: docker compose config --quiet

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-open-issues.yml
          git add app.py asset_management.py docker-compose.yml tests/test_asset_management.py tests/test_web_app.py
          git commit -m "fix: address asset management issues"
          git push origin HEAD:feat/asset-management
