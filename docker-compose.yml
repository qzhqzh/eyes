services:
  eyes-web:
    build: .
    container_name: eyes-web
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/app/data
      - /mnt/nas:/mnt/nas:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      EYES_DB_PATH: /app/data/eyes.db
      EYES_REQUIRE_SECURE_CONFIG: "1"
      EYES_SECRET_KEY: ${EYES_SECRET_KEY:?set EYES_SECRET_KEY in .env}
      EYES_WEB_PASSWORD: ${EYES_WEB_PASSWORD:?set EYES_WEB_PASSWORD in .env}
      EYES_HUB_ENROLL_TOKEN: ${EYES_HUB_ENROLL_TOKEN:-}
      EYES_ENABLE_SCHEDULED_CHECKS: ${EYES_ENABLE_SCHEDULED_CHECKS:-0}
      EYES_PORT: ${EYES_PORT:-8090}
      EYES_NAS_PATH: /mnt/nas
      EYES_NAS_FS_TYPES: ${EYES_NAS_FS_TYPES:-cifs,nfs,nfs4,smb3,fuse.sshfs}
      EYES_AGENT_URL: ${EYES_AGENT_URL:-http://127.0.0.1:9091}
      EYES_WIREGUARD_PROBES: ${EYES_WIREGUARD_PROBES:-}
