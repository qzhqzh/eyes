<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyes UI — 开发预览</title>
    
    <!-- 直接引用源码（Vite 会自动处理） -->
    <link rel="stylesheet" href="./src/styles/base.css">
    <link rel="stylesheet" href="./src/components/button/button.css">
    
    <!-- 临时：内联 CSS 变量 -->
    <style id="eyes-tokens"></style>
    
    <style>
        body {
            padding: 24px;
            font-family: var(--eyes-font-family);
        }
        
        .preview-section {
            margin-bottom: 32px;
        }
        
        .preview-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--eyes-text-primary);
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--eyes-border);
        }
        
        .preview-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        .preview-label {
            font-size: 12px;
            color: var(--eyes-text-muted);
            margin-bottom: 8px;
        }
        
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 8px;
        }
        
        .color-swatch {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 11px;
        }
        
        .color-swatch-dark {
            color: white;
        }
        
        .color-swatch-light {
            color: black;
        }
    </style>
</head>
<body>
    <h1 style="color: var(--eyes-text-primary); margin-bottom: 32px;">
        👁 Eyes UI — 组件预览
    </h1>

    <!-- ========== 颜色 ========== -->
    <div class="preview-section">
        <h2 class="preview-title">颜色</h2>
        <div class="preview-label">主色</div>
        <div class="color-grid" id="primary-colors"></div>
        
        <div class="preview-label" style="margin-top: 16px;">语义色</div>
        <div class="color-grid" id="semantic-colors"></div>
        
        <div class="preview-label" style="margin-top: 16px;">背景色</div>
        <div class="color-grid" id="bg-colors"></div>
        
        <div class="preview-label" style="margin-top: 16px;">文字颜色</div>
        <div class="color-grid" id="text-colors"></div>
    </div>

    <!-- ========== 按钮 ========== -->
    <div class="preview-section">
        <h2 class="preview-title">Button 按钮</h2>
        
        <div class="preview-label">变体</div>
        <div class="preview-row" id="button-variants"></div>
        
        <div class="preview-label">尺寸</div>
        <div class="preview-row" id="button-sizes"></div>
        
        <div class="preview-label">状态</div>
        <div class="preview-row" id="button-states"></div>
        
        <div class="preview-label">块级按钮</div>
        <div style="max-width: 300px;">
            <div class="preview-row" id="button-block"></div>
        </div>
    </div>

    <!-- ========== 开发信息 ========== -->
    <div class="preview-section">
        <h2 class="preview-title">开发信息</h2>
        <div style="background: var(--eyes-bg-card); padding: 16px; border-radius: 8px; font-size: 13px; color: var(--eyes-text-secondary);">
            <p><strong>开发模式</strong>：直接引用源码，修改即时生效</p>
            <p style="margin-top: 8px;"><strong>文件位置</strong>：</p>
            <ul style="margin-left: 20px; margin-top: 4px;">
                <li>设计令牌：<code>src/tokens/index.ts</code></li>
                <li>基础样式：<code>src/styles/base.css</code></li>
                <li>Button 组件：<code>src/components/button/</code></li>
            </ul>
            <p style="margin-top: 8px;"><strong>修改流程</strong>：</p>
            <ol style="margin-left: 20px; margin-top: 4px;">
                <li>编辑 <code>src/</code> 下的文件</li>
                <li>浏览器自动刷新（Vite HMR）</li>
                <li>稳定后运行 <code>npm run build</code></li>
            </ol>
        </div>
    </div>

    <script type="module">
        // 动态加载模块
        import { Button } from './src/components/button/Button.ts'
        import { generateCSSVariables } from './src/tokens/css-variables.ts'
        import { globalTokens, semanticTokens } from './src/tokens/index.ts'

        // 注入 CSS 变量
        document.getElementById('eyes-tokens').textContent = generateCSSVariables()

        // 渲染颜色
        function renderColors() {
            // 主色
            const primaryColors = document.getElementById('primary-colors')
            const indigo = globalTokens.colors.indigo
            primaryColors.innerHTML = Object.entries(indigo).map(([shade, color]) => `
                <div class="color-swatch ${parseInt(shade) > 400 ? 'color-swatch-dark' : 'color-swatch-light'}" 
                     style="background: ${color}">
                    ${shade}<br>${color}
                </div>
            `).join('')

            // 语义色
            const semanticColors = document.getElementById('semantic-colors')
            const semantic = [
                { name: 'Primary', color: semanticTokens.dark.primary },
                { name: 'Success', color: semanticTokens.dark.success },
                { name: 'Warning', color: semanticTokens.dark.warning },
                { name: 'Danger', color: semanticTokens.dark.danger },
            ]
            semanticColors.innerHTML = semantic.map(c => `
                <div class="color-swatch color-swatch-dark" style="background: ${c.color}">
                    ${c.name}<br>${c.color}
                </div>
            `).join('')

            // 背景色
            const bgColors = document.getElementById('bg-colors')
            const bgs = [
                { name: 'Page', color: semanticTokens.dark['bg-page'] },
                { name: 'Sidebar', color: semanticTokens.dark['bg-sidebar'] },
                { name: 'Card', color: semanticTokens.dark['bg-card'] },
                { name: 'Card Hover', color: semanticTokens.dark['bg-card-hover'] },
                { name: 'Input', color: semanticTokens.dark['bg-input'] },
            ]
            bgColors.innerHTML = bgs.map(c => `
                <div class="color-swatch color-swatch-dark" style="background: ${c.color}; border: 1px solid var(--eyes-border);">
                    ${c.name}<br>${c.color}
                </div>
            `).join('')

            // 文字颜色
            const textColors = document.getElementById('text-colors')
            const texts = [
                { name: 'Primary', color: semanticTokens.dark['text-primary'] },
                { name: 'Secondary', color: semanticTokens.dark['text-secondary'] },
                { name: 'Muted', color: semanticTokens.dark['text-muted'] },
                { name: 'Disabled', color: semanticTokens.dark['text-disabled'] },
            ]
            textColors.innerHTML = texts.map(c => `
                <div class="color-swatch" style="background: var(--eyes-bg-card); color: ${c.color}; border: 1px solid var(--eyes-border);">
                    ${c.name}<br>${c.color}
                </div>
            `).join('')
        }

        // 渲染按钮
        function renderButtons() {
            // 变体
            const variants = ['primary', 'secondary', 'success', 'danger', 'warning', 'info', 'ghost', 'text']
            document.getElementById('button-variants').innerHTML = variants.map(v => 
                Button({ text: v.charAt(0).toUpperCase() + v.slice(1), variant: v })
            ).join('')

            // 尺寸
            const sizes = ['sm', 'md', 'lg']
            document.getElementById('button-sizes').innerHTML = sizes.map(s =>
                Button({ text: s.toUpperCase(), size: s })
            ).join('')

            // 状态
            document.getElementById('button-states').innerHTML = [
                Button({ text: 'Disabled', disabled: true }),
                Button({ text: 'Loading', loading: true }),
            ].join('')

            // 块级
            document.getElementById('button-block').innerHTML = Button({ text: 'Block Button', block: true })
        }

        // 初始化
        renderColors()
        renderButtons()
    </script>
</body>
</html>
